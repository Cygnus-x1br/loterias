# docker-compose.prod.yml
# Ambiente de produção/homologação para rodar no Proxmox

services:
  # O container único da aplicação que usará a imagem de produção
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: loterias-app:latest
    container_name: loterias_app_prod
    restart: always
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # A chave deve ser a mesma do seu ambiente local, ou uma nova gerada com php artisan key:generate
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=loterias_prod
      - DB_USERNAME=loterias
      - DB_PASSWORD=${DB_PASSWORD:-senha_segura_aqui}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    networks:
      - loterias_prod_network
    depends_on:
      - mariadb

  # Banco de dados
  mariadb:
    image: mariadb:11
    container_name: loterias_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: loterias_prod
      MYSQL_USER: loterias
      MYSQL_PASSWORD: ${DB_PASSWORD:-senha_segura_aqui}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_senha_segura}
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    networks:
      - loterias_prod_network

networks:
  loterias_prod_network:
    driver: bridge

volumes:
  mariadb_prod_data:
    driver: local
