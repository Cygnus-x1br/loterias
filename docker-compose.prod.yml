# docker-compose.prod.yml
# Ambiente de produção/homologação para rodar no Proxmox

services:
  # O container único da aplicação que usará a imagem de produção
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: loterias-app:latest
    container_name: loterias_app_prod
    restart: always
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # A chave deve ser a mesma do seu ambiente local, ou uma nova gerada com php artisan key:generate
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/Sao_Paulo}
      - APP_LOCALE=${APP_LOCALE:-pt_BR}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE:-pt_BR}
      - APP_FAKER_LOCALE=${APP_FAKER_LOCALE:-pt_BR}
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=loterias_prod
      - DB_USERNAME=loterias
      - DB_PASSWORD=${DB_PASSWORD:-senha_segura_aqui}
      - SESSION_DRIVER=database
      - CACHE_STORE=${CACHE_STORE:-redis}
      - QUEUE_CONNECTION=database
      - REDIS_CLIENT=phpredis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - loterias_prod_network
    depends_on:
      - mariadb
      - redis

  # Banco de dados
  mariadb:
    image: mariadb:11
    container_name: loterias_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: loterias_prod
      MYSQL_USER: loterias
      MYSQL_PASSWORD: ${DB_PASSWORD:-senha_segura_aqui}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_senha_segura}
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    networks:
      - loterias_prod_network

  # Redis — serviço de cache em memória
  redis:
    image: redis:7-alpine
    container_name: loterias_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - loterias_prod_network

networks:
  loterias_prod_network:
    driver: bridge

volumes:
  mariadb_prod_data:
    driver: local
  redis_prod_data:
    driver: local
